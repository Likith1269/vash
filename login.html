<!DOCTYPE html>
<html>

<head>
    <title>Vash Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <div class="laundry-bg">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="washer">🧺</div>
    <div class="towels">🧼</div>
</div>

<div class="auth-bg">

    <div class="auth-brand">
<img src="vash-logo.png/vash-logo.png" class="vash-logo "> 
     <p>Laundry made simple</p>
    </div>

    <div class="auth-card">

        <div class="auth-icon">👤</div>

        <h2>Welcome Back!</h2>

        <p class="login-subtitle">
            Login to your account and continue with Vash
        </p>

        <form id="loginForm">

            <input type="text"
                   id="loginPhone"
                   placeholder="Phone Number"
                   required>

            <input type="password"
                   id="loginPassword"
                   placeholder="Password"
                   required>

            <button type="submit">
                Login →
            </button>

        </form>

        <div class="or-line">
            <span>OR</span>
        </div>

        <button class="create-account-btn"
        onclick="window.location.href='register.html'">
            👤 Create New Account
        </button>

        <p class="safe-text">
            🛡️ Your data is safe and secure with us.
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
