<!DOCTYPE html>
<html>
<head>
    <title>Vash Rider Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="laundry-bg">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="washer">🧺</div>
    <div class="towels">🧼</div>
</div>

<div class="container">
<img src="vash-logo.png/vash-logo.png" class="vash-logo">
    <h1>VASH RIDER</h1>

    <h2>Pickup & Delivery Dashboard</h2>

    <table border="1" width="100%" cellpadding="10">

        <thead>
            <tr>
                <th>Booking ID</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Item </th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
<th>Amount</th>
<th>Call</th>
<th>Location</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="riderTable"></tbody>

    </table>

</div>

<script>

let bookings =
    JSON.parse(localStorage.getItem("vashBookings")) || [];

let table = document.getElementById("riderTable");

function updateStatus(index, newStatus) {

    bookings[index].status = newStatus;

    localStorage.setItem(
        "vashBookings",
        JSON.stringify(bookings)
    );

    db.collection("bookings")
      .doc(bookings[index].bookingId)
      .update({
          status: newStatus
      })
      .then(() => {
          alert("Firebase updated");
          location.reload();
      })
      .catch((error) => {
          alert("Firebase Error: " + error.message);
      });

}
function formatItems(items) {

    let output = "";

    for (let key in items) {

        if (items[key].qty > 0) {

            output +=
                items[key].name +
                " × " +
                items[key].qty +
                "<br>";

        }

    }

    return output;
}
bookings
    .sort((a, b) => b.bookingId.localeCompare(a.bookingId))
    .forEach((booking, index) => {    table.innerHTML += `
        <tr>
            <td>${booking.bookingId}</td>
            <td>${booking.name}</td>
            <td>${booking.phone}</td>
            <td>${booking.address}</td>

<td>${formatItems(booking.items || {})}</td>

<td>${booking.date || "-"}</td>
<td>${booking.time || "-"}</td>
<td>${booking.status}</td>

<td>
    ₹${booking.totalAmount || 0}
</td>

<td>
    <a href="tel:${booking.phone}">
                    📞 Call
                </a>
            </td>

            <td>
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(booking.address)}" target="_blank">
                    📍 Open Map
                </a>
            </td>

            <td>
                <button onclick="updateStatus(${index}, 'Picked Up')">
                    🚚 Picked Up
                </button>

                <button onclick="updateStatus(${index}, 'Delivered')">
                    📦 Delivered
                </button>
            </td>

        </tr>
    `;

});
setInterval(() => {

    let updatedBookings =
        JSON.parse(localStorage.getItem("vashBookings")) || [];

    // Only reload UI if data changed
    if (JSON.stringify(updatedBookings) !== JSON.stringify(bookings)) {

        bookings = updatedBookings;

        // refresh UI
        location.reload(); // simple version (we can optimize later)

    }

}, 3000); // every 3 seconds

</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
</body>
</html>
